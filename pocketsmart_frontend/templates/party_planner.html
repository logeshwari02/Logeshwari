<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Party Planner · PocketSmart AI</title><link rel="stylesheet" href="../static/css/style.css"></head><body data-auth-required="true"><header class="nav"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">P</span><span>PocketSmart AI</span></a><nav class="nav-links" data-auth-nav></nav></div></header><main class="page"><div class="container form-shell"><div class="section-head"><div><span class="eyebrow">Party Budget Planner</span><h1>Plan your event around a total budget</h1><p>Set your guest count, event type, venue, food preference, and decoration style.</p></div></div><form class="card" onsubmit="submitParty(event)"><div class="form-grid"><div class="form-group"><label>Total budget (INR)</label><input name="budget" type="number" min="1" required placeholder="50000"></div><div class="form-group"><label>Guest count</label><input name="guest_count" type="number" min="1" required placeholder="50"></div><div class="form-group"><label>Event type</label><input name="event_type" required placeholder="Birthday Party"></div><div class="form-group"><label>Venue</label><input name="venue" placeholder="Banquet Hall"></div><div class="form-group"><label>City</label><input name="city" placeholder="Chennai"></div><div class="form-group"><label>Food preference</label><input name="food_preference" placeholder="Vegetarian"></div><div class="form-group"><label>Decoration style</label><input name="decoration_style" placeholder="Modern and colorful"></div><div class="form-group"><label>Notes</label><input name="notes" placeholder="Prefer simple elegant decorations"></div></div><div id="formStatus" style="margin-top:16px"></div><div class="form-actions"><a class="btn btn-secondary" href="dashboard.html">Cancel</a><button class="btn btn-primary">Generate Party Recommendations</button></div></form></div></main><script src="../static/js/app.js"></script><script src="../static/js/planners.js"></script></body></html>
