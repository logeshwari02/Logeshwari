<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register · PocketSmart AI</title><link rel="stylesheet" href="../static/css/style.css"></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">P</span><span>PocketSmart AI</span></a><nav class="nav-links"><a href="login.html">Login</a></nav></div></header><main class="auth-page"><div class="auth-card"><a class="brand" href="index.html"><span class="brand-mark">P</span><span>PocketSmart AI</span></a><h1>Create your account</h1><p class="help">Register to access personalized recommendations and saved history.</p><form onsubmit="submitRegister(event)"><div class="form-group" style="margin-top:18px"><label>Full name</label><input name="full_name" minlength="2" maxlength="120" required placeholder="Sujay Emmanuel"></div><div class="form-group" style="margin-top:15px"><label>Email</label><input name="email" type="email" required placeholder="you@example.com"></div><div class="form-group" style="margin-top:15px"><label>Password</label><input name="password" type="password" minlength="8" maxlength="128" required></div><div class="form-group" style="margin-top:15px"><label>Confirm password</label><input name="confirm_password" type="password" minlength="8" required></div><div id="formStatus" style="margin-top:14px"></div><button class="btn btn-primary" style="width:100%;margin-top:18px">Create account</button></form><div class="auth-foot">Already have an account? <a style="color:var(--primary);font-weight:700" href="login.html">Login</a></div></div></main><script src="../static/js/app.js"></script><script src="../static/js/auth.js"></script></body></html>
