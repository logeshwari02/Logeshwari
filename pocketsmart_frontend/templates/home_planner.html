<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Interior Planner · PocketSmart AI</title><link rel="stylesheet" href="../static/css/style.css"></head><body data-auth-required="true"><header class="nav"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">P</span><span>PocketSmart AI</span></a><nav class="nav-links" data-auth-nav></nav></div></header><main class="page"><div class="container form-shell"><div class="section-head"><div><span class="eyebrow">Home Interior Planner</span><h1>Build your home plan around a budget</h1><p>Enter rooms, items, quantities, and style preferences.</p></div></div><form class="card" onsubmit="submitHome(event)"><div class="form-grid"><div class="form-group"><label>Total budget (INR)</label><input name="budget" type="number" min="1" required placeholder="100000"></div><div class="form-group"><label>City</label><input name="city" placeholder="Chennai"></div><div class="form-group full"><label>Rooms</label><input name="rooms" required placeholder="Living Room, Bedroom"></div><div class="form-group"><label>Overall style</label><input name="style" placeholder="Modern"></div><div class="form-group"><label>Notes</label><input name="notes" placeholder="Prefer durable products"></div></div><div style="margin-top:20px"><div class="section-head" style="margin-bottom:10px"><div><h2 style="font-size:1.15rem">Items</h2><p>Add furniture, lighting, decor, and other needs.</p></div><button type="button" class="btn btn-secondary" onclick="addHomeItem()">+ Add item</button></div><div id="homeItems"><div class="card" data-home-item style="padding:16px"><div class="form-grid"><div class="form-group"><label>Item</label><input class="item-name" placeholder="Sofa" required></div><div class="form-group"><label>Quantity</label><input class="item-qty" type="number" min="1" value="1" required></div><div class="form-group"><label>Preferred style</label><input class="item-style" placeholder="Modern"></div><div class="form-group"><label>&nbsp;</label><button type="button" class="btn btn-secondary" onclick="this.closest('[data-home-item]').remove()">Remove item</button></div></div></div></div></div><div id="formStatus" style="margin-top:16px"></div><div class="form-actions"><a class="btn btn-secondary" href="dashboard.html">Cancel</a><button class="btn btn-primary">Generate Home Recommendations</button></div></form></div></main><script src="../static/js/app.js"></script><script src="../static/js/planners.js"></script></body></html>
