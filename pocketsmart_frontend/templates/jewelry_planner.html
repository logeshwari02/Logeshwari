<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jewelry Planner · PocketSmart AI</title><link rel="stylesheet" href="../static/css/style.css"></head><body data-auth-required="true"><header class="nav"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">P</span><span>PocketSmart AI</span></a><nav class="nav-links" data-auth-nav></nav></div></header><main class="page"><div class="container form-shell"><div class="section-head"><div><span class="eyebrow">Jewelry Budget Planner</span><h1>Find jewelry for the occasion and style</h1><p>Use text preferences and optionally upload an outfit image for visual coordination.</p></div></div><form class="card" enctype="multipart/form-data" onsubmit="submitJewelry(event)"><div class="form-grid"><div class="form-group"><label>Budget (INR)</label><input name="budget" type="number" min="1" required placeholder="10000"></div><div class="form-group"><label>Occasion</label><input name="occasion" required placeholder="Wedding"></div><div class="form-group"><label>Style</label><input name="style" placeholder="Elegant"></div><div class="form-group"><label>Metal preference</label><input name="metal_preference" placeholder="Silver"></div><div class="form-group"><label>Outfit color</label><input name="outfit_color" placeholder="Dark green"></div><div class="form-group"><label>Outfit image (optional)</label><input id="outfit_image" name="outfit_image" type="file" accept="image/jpeg,image/png,image/webp"></div><div class="form-group full"><label>Notes</label><textarea name="notes" placeholder="Use the uploaded outfit image to match the jewelry with the outfit's colors and overall style. Prefer elegant, minimalist pieces and keep the total cost within the budget."></textarea><div class="help">Accepted image types: JPEG, PNG, WEBP. The upload is optional.</div><div id="imagePreview" class="preview"><img id="previewImg" alt="Outfit preview"></div></div></div><div id="formStatus" style="margin-top:16px"></div><div class="form-actions"><a class="btn btn-secondary" href="dashboard.html">Cancel</a><button class="btn btn-primary">Generate Jewelry Recommendations</button></div></form></div></main><script src="../static/js/app.js"></script><script src="../static/js/planners.js"></script></body></html>
